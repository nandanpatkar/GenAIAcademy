# Deploy this Blueprint from a separate Render account. Do not merge it into the
# root render.yaml: the existing Job Scout keep-warm strategy already consumes
# almost all of that account's 750 monthly Free instance-hours.
services:
  - type: web
    name: genai-academy-langflow
    runtime: docker
    plan: free
    region: singapore
    dockerfilePath: ./langflow-deploy/Dockerfile
    envVars:
      - key: PORT
        value: "7860"
      - key: LANGFLOW_HOST
        value: "0.0.0.0"
      - key: LANGFLOW_PORT
        value: "7860"
      - key: LANGFLOW_CONFIG_DIR
        value: "/app/langflow"
      - key: LANGFLOW_AUTO_LOGIN
        value: "false"
      - key: LANGFLOW_DATABASE_URL
        fromDatabase:
          name: genai-academy-langflow-db
          property: connectionString
      - key: LANGFLOW_SECRET_KEY
        generateValue: true
      - key: LANGFLOW_SUPERUSER
        sync: false
      - key: LANGFLOW_SUPERUSER_PASSWORD
        sync: false

databases:
  - name: genai-academy-langflow-db
    plan: free
    region: singapore
