# Job Scout — single public port in front of two loopback servers.
#
# app.py and api.py both bind 127.0.0.1 explicitly (app.py:main passes
# server_name="127.0.0.1", so GRADIO_SERVER_NAME cannot override it), which
# means neither is reachable from outside the container. They also have to stay
# in ONE process: the voice bridge and the LangGraph MemorySaver are both
# process-wide.
#
# So instead of editing either file, this proxy runs inside the same container
# and reaches them over loopback. One exposed port, both surfaces, zero changes
# to the agent.

server {
  listen 8080;
  server_name _;

  # A CV upload is a PDF; Gradio posts it as multipart.
  client_max_body_size 32m;

  # /api/events is SSE and Gradio has its own event stream. Buffering either
  # one turns streamed progress into a single dump at the end.
  proxy_buffering off;
  proxy_read_timeout 3600s;
  proxy_send_timeout 3600s;

  proxy_http_version 1.1;
  proxy_set_header Upgrade           $http_upgrade;
  proxy_set_header Connection        "upgrade";
  # $http_host, NOT $host: $host drops the port, so Gradio derived its API root
  # as "http://localhost" and the browser hammered a refused connection on :80.
  proxy_set_header Host              $http_host;
  proxy_set_header X-Real-IP         $remote_addr;
  proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
  proxy_set_header X-Forwarded-Proto $scheme;

  # FastAPI: voice tokens, tool dispatch, /api/state, /api/events, pack downloads.
  location /api/ {
    proxy_pass http://127.0.0.1:8000;
  }

  # The Jobvis console, only once `make web-build` has produced web/out — until
  # then api.py does not mount it and these simply 404, which is harmless.
  location /_next/ {
    proxy_pass http://127.0.0.1:8000;
  }
  location /jobvis {
    proxy_pass http://127.0.0.1:8000/;
  }

  # Everything else is the Gradio wizard.
  location / {
    proxy_pass http://127.0.0.1:7860;
  }
}
