<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Token Cost Lab — Beat the Bill</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --ink:#0E1116; --ink-2:#1A1F27; --paper:#FBFAF7; --panel:#FFFFFF;
  --line:#E3E0D8; --line-2:#D2CEC3; --muted:#6C7280; --muted-2:#9AA0A8;
  --bad:#C0392B; --bad-bg:#FDF1EF; --good:#1E7A4C; --good-bg:#EFF7F1;
  --accent:#2F3BB3; --accent-bg:#EEF0FC; --warn:#B4761A;
  --gold:#C9992B; --xp:#7C3AED;
  --code-bg:#12151B; --r:10px;
  --mono:"IBM Plex Mono",ui-monospace,monospace;
  --disp:"Space Grotesk",system-ui,sans-serif;
  --body:"Inter",system-ui,-apple-system,sans-serif;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{background:var(--paper);color:var(--ink);font-family:var(--body);font-size:15px;line-height:1.55;-webkit-font-smoothing:antialiased;overflow-x:hidden}
button{font-family:inherit;cursor:pointer}
::selection{background:#DDE1FA}

/* ambient bg */
#ambient{position:fixed;inset:0;z-index:0;pointer-events:none;opacity:.5}
.app{display:flex;min-height:100vh;position:relative;z-index:1}

/* ---------- SIDEBAR ---------- */
.sidebar{width:300px;flex:0 0 300px;border-right:1px solid var(--line);background:#F6F4EF;height:100vh;position:sticky;top:0;display:flex;flex-direction:column;z-index:5}
.brand{padding:18px 20px 14px;border-bottom:1px solid var(--line)}
.brand .ch{font-family:var(--mono);font-size:10.5px;letter-spacing:.16em;text-transform:uppercase;color:var(--accent);font-weight:600}
.brand h1{font-family:var(--disp);font-size:19px;line-height:1.2;margin:6px 0 0;letter-spacing:-.02em;font-weight:700}
.brand .sub{font-size:11.5px;color:var(--muted);margin-top:4px}

/* player card in sidebar */
.player{padding:13px 16px;border-bottom:1px solid var(--line);background:#F1EFE8}
.plrow{display:flex;align-items:center;gap:10px}
.lvlbadge{width:38px;height:38px;border-radius:10px;background:linear-gradient(135deg,var(--xp),#9D5BF0);display:grid;place-items:center;color:#fff;font-family:var(--disp);font-weight:700;font-size:17px;flex:0 0 38px;box-shadow:0 2px 6px rgba(124,58,237,.35)}
.plinfo{flex:1;min-width:0}
.plinfo .rank{font-family:var(--disp);font-size:13.5px;font-weight:700;line-height:1.1}
.plinfo .xpn{font-family:var(--mono);font-size:10.5px;color:var(--muted)}
.xpbar{height:5px;background:#E1DED6;border-radius:3px;margin-top:5px;overflow:hidden}
.xpbar i{display:block;height:100%;background:linear-gradient(90deg,var(--xp),#A56BF2);width:0;border-radius:3px;transition:width .6s cubic-bezier(.2,.7,.3,1)}

.searchbox{padding:11px 16px 9px;border-bottom:1px solid var(--line)}
.searchbox input{width:100%;padding:8px 10px;border:1px solid var(--line-2);border-radius:7px;font-family:var(--body);font-size:13px;background:#fff;color:var(--ink)}
.searchbox input:focus{outline:2px solid var(--accent);outline-offset:1px;border-color:transparent}
.navscroll{overflow-y:auto;flex:1;padding-bottom:20px}
.groupwrap{padding:11px 12px 4px}
.grouphead{font-family:var(--mono);font-size:10px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted-2);padding:0 8px 7px;font-weight:600}
.gitem{display:flex;align-items:center;gap:9px;padding:5px 8px;border-radius:7px;font-size:12px;font-weight:600;color:var(--ink-2)}
.gbadge{width:16px;height:16px;border-radius:5px;display:grid;place-items:center;font-family:var(--mono);font-size:9.5px;color:#fff;font-weight:600;flex:0 0 16px}
.divline{height:1px;background:var(--line);margin:7px 16px}
.navlist{padding:4px 12px}
.nav-i{display:flex;align-items:center;gap:9px;width:100%;padding:7px 9px;border:0;background:none;text-align:left;border-radius:7px;color:var(--ink-2);border-left:3px solid transparent;transition:background .12s}
.nav-i:hover{background:#EDEAE2}
.nav-i.on{background:#E7E9F9;border-left-color:var(--accent);color:var(--accent)}
.nav-i .n{font-family:var(--mono);font-size:11px;color:var(--muted-2);flex:0 0 18px}
.nav-i.on .n{color:var(--accent)}
.nav-i .t{font-size:12.6px;font-weight:600;line-height:1.25;flex:1}
.nav-i .status{width:16px;height:16px;flex:0 0 16px;display:grid;place-items:center;font-size:11px}
.nav-i .status .done{color:var(--good);font-weight:700}
.nav-i .status .lock{color:var(--muted-2)}
.navfoot{padding:9px 16px;border-top:1px solid var(--line);font-size:10.5px;color:var(--muted);display:flex;justify-content:space-between;align-items:center}
.navfoot a{color:var(--accent);text-decoration:none;font-weight:600}
.kbdhint{font-family:var(--mono);font-size:9.5px;color:var(--muted-2)}

/* ---------- MAIN ---------- */
.main{flex:1;min-width:0;padding:0 0 90px;position:relative}
.wrap{max-width:1180px;margin:0 auto;padding:0 34px}

/* MISSION BAR (sticky top) */
.mission{position:sticky;top:0;z-index:20;background:var(--ink);color:#fff;border-bottom:1px solid #000}
.mission .wrap{display:flex;align-items:center;gap:22px;padding:10px 34px}
.mgroup{display:flex;flex-direction:column;gap:1px}
.mgroup .ml{font-family:var(--mono);font-size:9px;letter-spacing:.13em;text-transform:uppercase;color:#8B949E;font-weight:600}
.mgroup .mv{font-family:var(--disp);font-size:19px;font-weight:700;letter-spacing:-.02em;line-height:1}
.mv.cost{color:#FF8B7E}
.mv.target{color:#67D998}
.mv.score{color:#E8C15A}
.mprog{flex:1;min-width:90px}
.mprog .track{height:9px;background:#2A303A;border-radius:5px;overflow:hidden;position:relative}
.mprog .track i{display:block;height:100%;background:linear-gradient(90deg,#1E7A4C,#48C07E);width:0;border-radius:5px;transition:width .7s cubic-bezier(.2,.7,.3,1)}
.mprog .pct{font-family:var(--mono);font-size:10px;color:#8B949E;margin-top:3px;display:flex;justify-content:space-between}
.mtabs{display:flex;gap:3px;background:#1A1F27;padding:3px;border-radius:9px}
.mtab{border:0;background:none;padding:6px 12px;border-radius:7px;font-size:12px;font-weight:600;color:#8B949E}
.mtab.on{background:#fff;color:var(--ink)}
.pager{display:flex;align-items:center;gap:7px}
.pgbtn{width:29px;height:29px;border:1px solid #2A303A;background:#1A1F27;border-radius:7px;font-size:14px;color:#C9D1D9;display:grid;place-items:center}
.pgbtn:hover:not(:disabled){background:#252C37}
.pgbtn:disabled{opacity:.3;cursor:not-allowed}
.pgnum{font-family:var(--mono);font-size:11px;color:#8B949E;min-width:46px;text-align:center}

.mobnav{display:none}

/* ---------- LESSON CARD ---------- */
.card{margin-top:22px}
.chapline{font-family:var(--mono);font-size:10.5px;letter-spacing:.15em;text-transform:uppercase;color:var(--accent);font-weight:600;margin-bottom:3px}
.chead{background:var(--accent-bg);border:1px solid #D6DAF6;border-radius:var(--r);padding:19px 22px 20px;border-bottom:3px solid var(--accent)}
.chead .kicker{display:flex;align-items:center;gap:10px;margin-bottom:8px}
.chead .chip{font-family:var(--mono);font-size:10px;letter-spacing:.1em;text-transform:uppercase;padding:3px 9px;border-radius:5px;font-weight:600}
.chip.cat{background:#fff;color:var(--accent);border:1px solid #D6DAF6}
.chip.xp{background:#F1EBFD;color:var(--xp);border:1px solid #E2D3FA}
.chead h2{font-family:var(--disp);font-size:29px;line-height:1.08;margin:0 0 9px;letter-spacing:-.025em;font-weight:700}
.chead .story{font-family:var(--disp);font-size:15px;color:var(--accent);font-weight:600;font-style:italic;margin:0 0 6px}
.chead .lede{font-size:15px;color:var(--ink-2);max-width:80ch;margin:0}

/* step flow */
.steps{display:flex;align-items:center;gap:0;margin:16px 0 4px;flex-wrap:wrap}
.stepdot{display:flex;align-items:center;gap:7px;font-family:var(--mono);font-size:10.5px;color:var(--muted-2);font-weight:600;text-transform:uppercase;letter-spacing:.06em}
.stepdot .b{width:20px;height:20px;border-radius:50%;border:2px solid var(--line-2);display:grid;place-items:center;font-size:10px;color:var(--muted-2);background:#fff;transition:all .3s}
.stepdot.done .b{background:var(--good);border-color:var(--good);color:#fff}
.stepdot.active .b{border-color:var(--accent);color:var(--accent);box-shadow:0 0 0 3px var(--accent-bg)}
.stepdot.active{color:var(--accent)}
.stepsep{width:22px;height:2px;background:var(--line);margin:0 7px}
.stepsep.done{background:var(--good)}

/* stage blocks that unlock */
.stage{margin-top:16px;opacity:0;max-height:0;overflow:hidden;transition:opacity .5s,max-height .6s ease}
.stage.show{opacity:1;max-height:4000px}
.stage.locked-note{opacity:1;max-height:200px}

/* run row */
.runrow{display:flex;align-items:center;gap:14px;margin-top:16px;flex-wrap:wrap}
.runbtn{background:var(--ink);color:#fff;border:0;border-radius:9px;padding:13px 24px;font-size:15px;font-weight:600;display:flex;align-items:center;gap:9px;box-shadow:0 3px 10px rgba(14,17,22,.2)}
.runbtn:hover:not(:disabled){background:#25303F;transform:translateY(-1px)}
.runbtn:disabled{opacity:.55;cursor:progress}
.runbtn.big{padding:15px 34px;font-size:17px}
.hint{font-size:13px;color:var(--muted);font-style:italic;flex:1;min-width:200px}
.ghostbtn{border:1px solid var(--line-2);background:#fff;border-radius:8px;padding:10px 15px;font-size:12.5px;font-weight:600;color:var(--ink-2)}
.ghostbtn:hover{background:#F0EEE8}

/* split simulation */
.split{display:grid;grid-template-columns:1fr 1fr;gap:18px;margin-top:6px}
.side h4{font-family:var(--mono);font-size:11px;letter-spacing:.13em;text-transform:uppercase;margin:0 0 8px;font-weight:600}
.side.bad h4{color:var(--bad)}
.side.good h4{color:var(--good)}
.pane{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:16px;height:100%}
.side.bad .pane{border-color:#EFD6D2}
.side.good .pane{border-color:#CFE5D8}
.viz{min-height:150px;display:flex;flex-direction:column;justify-content:center}
.vizcap{font-size:11.5px;color:var(--muted);margin-top:9px;font-family:var(--mono)}
.mrow{display:grid;grid-template-columns:repeat(3,1fr);gap:14px;margin:15px 0 13px}
.m .lab{font-family:var(--mono);font-size:9.5px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);font-weight:600}
.m .val{font-family:var(--disp);font-size:24px;font-weight:700;line-height:1.1;margin-top:2px;letter-spacing:-.02em}
.m .val small{font-size:12px;font-weight:600;margin-left:1px}
.side.bad .m .val{color:var(--bad)}
.side.good .m .val{color:var(--good)}
.bar{height:3px;background:#E8E5DE;border-radius:2px;margin-top:6px;overflow:hidden}
.bar i{display:block;height:100%;width:0;border-radius:2px;transition:width .55s cubic-bezier(.2,.7,.3,1)}
.side.bad .bar i{background:var(--bad)}
.side.good .bar i{background:var(--good)}
.term{background:var(--code-bg);border-radius:8px;padding:13px 14px;font-family:var(--mono);font-size:12px;line-height:1.75;min-height:116px}
.tl{display:flex;gap:11px;opacity:0;transform:translateY(3px);animation:tin .3s forwards}
@keyframes tin{to{opacity:1;transform:none}}
.tl .ln{color:#4A5361;flex:0 0 17px;text-align:right;user-select:none}
.tl .tx{color:#C9D1D9;white-space:pre-wrap;word-break:break-word}
.tl.r .tx{color:#FF8B7E}.tl.g .tx{color:#67D998}.tl.y .tx{color:#E8B84B}.tl.d .tx{color:#8B949E}
.cursor{display:inline-block;width:7px;height:14px;background:#67D998;vertical-align:-2px;animation:bl .9s steps(2) infinite}
@keyframes bl{50%{opacity:0}}

/* what happened / code / impact */
.lower{display:grid;grid-template-columns:1fr 340px;gap:18px;margin-top:18px;align-items:start}
.blk{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:17px 19px}
.blk h4{font-family:var(--mono);font-size:10.5px;letter-spacing:.13em;text-transform:uppercase;color:var(--muted);margin:0 0 11px;font-weight:600}
.whath{font-size:14.5px;color:var(--ink-2);margin:0 0 14px;line-height:1.6}
.buildlist{list-style:none;margin:0;padding:0;display:grid;gap:7px}
.buildlist li{display:flex;gap:9px;align-items:flex-start;font-size:14px}
.buildlist .dot{width:5px;height:5px;border-radius:50%;background:var(--good);margin-top:8px;flex:0 0 5px}
.impact{background:var(--accent-bg);border-color:#D6DAF6}
.impact .big{font-family:var(--disp);font-size:19px;font-weight:700;letter-spacing:-.02em;line-height:1.25}
.savechip{display:inline-flex;align-items:center;gap:6px;margin-top:13px;background:#fff;border:1px solid #CFE5D8;border-radius:99px;padding:5px 12px;font-family:var(--mono);font-size:12px;font-weight:600;color:var(--good)}
.techrow{display:flex;flex-wrap:wrap;gap:6px;margin-top:13px}
.tech{font-family:var(--mono);font-size:11px;background:#F2F0EA;border:1px solid var(--line);border-radius:6px;padding:3px 8px;color:var(--ink-2)}
.protip{margin-top:12px}
.protipbtn{border:1px solid #E2D3FA;background:#F7F2FE;border-radius:8px;padding:8px 13px;font-size:12.5px;font-weight:600;color:var(--xp);display:inline-flex;gap:7px;align-items:center}
.protipbody{margin-top:9px;font-size:13.5px;color:var(--ink-2);background:#FBF8FF;border:1px solid #EEE3FB;border-radius:8px;padding:12px 14px;line-height:1.55;display:none}
.protipbody.show{display:block}

/* code */
.codeblk{margin-top:0;border:1px solid var(--line);border-radius:var(--r);overflow:hidden}
.codehead{background:#F2F0EA;padding:9px 15px;border-bottom:1px solid var(--line);font-family:var(--mono);font-size:11px;letter-spacing:.09em;text-transform:uppercase;color:var(--muted);display:flex;align-items:center;gap:10px;font-weight:600}
.copybtn{margin-left:auto;border:1px solid var(--line-2);background:#fff;border-radius:6px;padding:3px 10px;font-family:var(--mono);font-size:10.5px;color:var(--ink-2);text-transform:none;letter-spacing:0}
.copybtn:hover{background:#EDEAE2}
pre.code{margin:0;background:var(--code-bg);color:#C9D1D9;padding:15px 17px;font-family:var(--mono);font-size:12.5px;line-height:1.68;overflow-x:auto}
.code .k{color:#FF7B95}.code .s{color:#A5D6FF}.code .c{color:#7D8590;font-style:italic}.code .f{color:#D2A8FF}.code .n{color:#79C0FF}.code .cm{color:#FFA657}

/* cliffhanger */
.cliff{background:var(--ink);color:#fff;border-radius:var(--r);padding:22px 24px;margin-top:18px;display:flex;align-items:center;gap:20px;flex-wrap:wrap}
.cliff .ct{flex:1;min-width:240px}
.cliff .cl{font-family:var(--mono);font-size:10px;letter-spacing:.14em;text-transform:uppercase;color:#8B949E;font-weight:600}
.cliff .cx{font-family:var(--disp);font-size:18px;font-weight:600;letter-spacing:-.015em;line-height:1.35;margin-top:6px}
.cliff .cx em{color:#67D998;font-style:normal}
.cliff .nextbtn{background:#fff;color:var(--ink);border:0;border-radius:9px;padding:13px 22px;font-size:14px;font-weight:700;display:flex;align-items:center;gap:8px}
.cliff .nextbtn:hover{background:#E8E9F5}

/* quiz */
.quizcard{background:#FFFBF3;border:1px solid #EAD9B0;border-radius:var(--r);padding:18px 20px;margin-top:18px}
.quizcard h4{font-family:var(--mono);font-size:10.5px;letter-spacing:.13em;text-transform:uppercase;color:var(--warn);margin:0 0 10px;font-weight:600}
.quizq{font-family:var(--disp);font-size:16px;font-weight:600;margin:0 0 13px}
.quizopts{display:grid;gap:8px}
.qopt{border:1px solid var(--line-2);background:#fff;border-radius:8px;padding:11px 14px;font-size:13.5px;text-align:left;color:var(--ink-2);display:flex;gap:10px;align-items:center}
.qopt:hover{border-color:var(--warn)}
.qopt .qk{font-family:var(--mono);font-size:11px;color:var(--muted);font-weight:600;flex:0 0 16px}
.qopt.correct{border-color:var(--good);background:var(--good-bg);color:var(--good);font-weight:600}
.qopt.wrong{border-color:var(--bad);background:var(--bad-bg);color:var(--bad)}
.quizfb{margin-top:11px;font-size:13.5px;font-weight:600;min-height:20px}

/* locked note */
.locknote{background:#F6F4EF;border:1px dashed var(--line-2);border-radius:var(--r);padding:16px 20px;text-align:center;color:var(--muted);font-size:13.5px;display:flex;align-items:center;justify-content:center;gap:9px}
.locknote .lk{font-size:16px}

/* toast + achievements */
#toasts{position:fixed;bottom:24px;right:24px;z-index:200;display:flex;flex-direction:column;gap:10px;align-items:flex-end}
.toast{background:var(--ink);color:#fff;border-radius:12px;padding:14px 18px;box-shadow:0 8px 24px rgba(0,0,0,.28);display:flex;align-items:center;gap:13px;min-width:240px;max-width:340px;transform:translateX(120%);animation:tin2 .45s cubic-bezier(.2,.9,.3,1) forwards;border:1px solid #2A303A}
@keyframes tin2{to{transform:none}}
.toast.out{animation:tout .4s forwards}
@keyframes tout{to{transform:translateX(120%);opacity:0}}
.toast .ic{font-size:26px;flex:0 0 auto}
.toast .tt{font-family:var(--disp);font-size:14px;font-weight:700;line-height:1.2}
.toast .td{font-size:12px;color:#8B949E;margin-top:2px}
.toast.gold{border-color:var(--gold)}
.toast.gold .tt{color:#F0C14B}

/* confetti canvas */
#confetti{position:fixed;inset:0;z-index:190;pointer-events:none}

/* celebration overlay */
#celebrate{position:fixed;inset:0;z-index:180;background:rgba(14,17,22,.55);backdrop-filter:blur(3px);display:none;align-items:center;justify-content:center}
#celebrate.show{display:flex}
.celbox{background:#fff;border-radius:18px;padding:34px 40px;text-align:center;max-width:440px;box-shadow:0 20px 60px rgba(0,0,0,.35);animation:pop .5s cubic-bezier(.2,1.2,.4,1)}
@keyframes pop{from{transform:scale(.8);opacity:0}to{transform:none;opacity:1}}
.celbox .emoji{font-size:52px}
.celbox h3{font-family:var(--disp);font-size:26px;margin:8px 0 4px;letter-spacing:-.02em}
.celbox .big{font-family:var(--disp);font-size:40px;font-weight:700;color:var(--good);letter-spacing:-.03em;margin:6px 0}
.celbox p{color:var(--muted);font-size:14px;margin:6px 0 18px}
.celbox button{background:var(--ink);color:#fff;border:0;border-radius:10px;padding:12px 26px;font-size:14px;font-weight:600}

/* ---------- OVERVIEW / CALC ---------- */
.hero{padding:40px 0 26px;border-bottom:1px solid var(--line)}
.hero .kick{font-family:var(--mono);font-size:11px;letter-spacing:.18em;text-transform:uppercase;color:var(--accent);font-weight:600}
.hero h2{font-family:var(--disp);font-size:44px;line-height:1.04;letter-spacing:-.035em;margin:12px 0 14px;font-weight:700;max-width:20ch}
.hero p{font-size:16px;color:var(--muted);max-width:62ch;margin:0}
.hero .strike{color:var(--ink);font-weight:600}
.startbtn{margin-top:22px;background:var(--ink);color:#fff;border:0;border-radius:11px;padding:15px 30px;font-size:16px;font-weight:700;display:inline-flex;gap:10px;align-items:center;box-shadow:0 4px 14px rgba(14,17,22,.22)}
.startbtn:hover{background:#25303F;transform:translateY(-1px)}
.calcgrid{display:grid;grid-template-columns:1fr 400px;gap:26px;margin-top:30px;align-items:start}
.ctrl{margin-bottom:16px}
.ctrl label{display:flex;justify-content:space-between;font-size:13px;font-weight:600;margin-bottom:6px}
.ctrl label b{font-family:var(--mono);color:var(--accent);font-weight:600}
input[type=range]{width:100%;accent-color:var(--accent);height:20px}
.selrow{display:flex;gap:6px;flex-wrap:wrap}
.selrow button{border:1px solid var(--line-2);background:#fff;border-radius:7px;padding:5px 11px;font-size:12px;font-weight:600;color:var(--muted)}
.selrow button.on{background:var(--ink);color:#fff;border-color:var(--ink)}
.billcard{background:var(--ink);color:#fff;border-radius:12px;padding:24px;position:sticky;top:74px}
.billcard .lab{font-family:var(--mono);font-size:10px;letter-spacing:.14em;text-transform:uppercase;color:#8B949E;font-weight:600}
.billcard .amt{font-family:var(--disp);font-size:40px;font-weight:700;letter-spacing:-.035em;line-height:1.05;margin:5px 0 2px}
.billcard .amt.red{color:#FF8B7E}.billcard .amt.grn{color:#67D998}
.billcard .sub{font-size:12.5px;color:#8B949E}
.billsplit{height:1px;background:#2A303A;margin:19px 0}
.saveline{display:flex;justify-content:space-between;align-items:baseline;margin-top:11px}
.saveline .t{font-size:13px;color:#C9D1D9}.saveline .v{font-family:var(--mono);font-size:14px;color:#67D998;font-weight:600}
.togglegrid{display:grid;gap:6px;margin-top:14px;max-height:240px;overflow-y:auto;padding-right:4px}
.tg{display:flex;align-items:center;gap:9px;background:#1A1F27;border:1px solid #2A303A;border-radius:7px;padding:7px 10px;cursor:pointer}
.tg:hover{border-color:#3C4553}.tg.on{border-color:#2F6B4C;background:#16241C}
.tg .box{width:14px;height:14px;border-radius:4px;border:1.5px solid #4A5361;flex:0 0 14px;display:grid;place-items:center;font-size:9px;color:#0E1116}
.tg.on .box{background:#67D998;border-color:#67D998}
.tg .nm{font-size:12px;color:#C9D1D9;flex:1}.tg .pc{font-family:var(--mono);font-size:11px;color:#67D998}

.sec{padding:36px 0;border-bottom:1px solid var(--line)}
.sechead{font-family:var(--disp);font-size:25px;letter-spacing:-.025em;margin:0 0 6px;font-weight:700}
.secsub{color:var(--muted);font-size:14.5px;margin:0 0 22px;max-width:66ch}
.rcgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(212px,1fr));gap:13px}
.rc{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:16px}
.rc .num{font-family:var(--mono);font-size:10px;letter-spacing:.12em;color:var(--muted-2);font-weight:600}
.rc h5{font-family:var(--disp);font-size:16px;margin:6px 0 7px;letter-spacing:-.015em;font-weight:700}
.rc p{font-size:13px;color:var(--muted);margin:0 0 10px;line-height:1.5}
.rc .ids{display:flex;flex-wrap:wrap;gap:4px}
.rc .id{font-family:var(--mono);font-size:10px;background:#F2F0EA;border-radius:4px;padding:2px 6px;color:var(--ink-2);border:1px solid var(--line)}
.rc .id:hover{background:var(--accent);color:#fff;cursor:pointer;border-color:var(--accent)}
.pipe{display:flex;gap:8px;overflow-x:auto;padding:4px 0 14px}
.pstage{flex:0 0 148px;background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:13px;text-align:left}
.pstage:hover{border-color:var(--accent)}
.pstage.on{border-color:var(--accent);background:var(--accent-bg);box-shadow:0 0 0 1px var(--accent)}
.pstage .pn{font-family:var(--mono);font-size:9.5px;color:var(--muted-2);letter-spacing:.1em;font-weight:600}
.pstage .pt{font-family:var(--disp);font-size:13.5px;font-weight:700;margin:4px 0;line-height:1.25}
.pstage .pd{font-size:11px;color:var(--muted);line-height:1.4}
.pdetail{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:17px 19px;margin-top:4px}
.pdetail h5{font-family:var(--disp);font-size:17px;margin:0 0 7px;letter-spacing:-.02em}
.pdetail p{font-size:14px;color:var(--ink-2);margin:0 0 12px;max-width:80ch}
.rmgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(258px,1fr));gap:14px}
.rm{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:17px}
.rm .wk{font-family:var(--mono);font-size:10px;letter-spacing:.13em;text-transform:uppercase;font-weight:600;padding:3px 9px;border-radius:5px;display:inline-block}
.rm.w1 .wk{background:#EFF7F1;color:var(--good)}.rm.w2 .wk{background:#FDF6E9;color:var(--warn)}.rm.w3 .wk{background:var(--accent-bg);color:var(--accent)}
.rm h5{font-family:var(--disp);font-size:16.5px;margin:10px 0 6px;letter-spacing:-.02em}
.rm ul{margin:0;padding-left:17px;font-size:13.5px;color:var(--ink-2)}
.rm ul li{margin-bottom:5px}
.rm .eff{font-size:12px;color:var(--muted);margin-top:11px;font-family:var(--mono)}
.thepoint{background:var(--ink);color:#fff;border-radius:12px;padding:30px 32px;margin-top:26px}
.thepoint .lab{font-family:var(--mono);font-size:10.5px;letter-spacing:.15em;text-transform:uppercase;color:#8B949E;font-weight:600}
.thepoint p{font-family:var(--disp);font-size:22px;line-height:1.38;margin:11px 0 0;letter-spacing:-.02em;max-width:52ch;font-weight:500}
.thepoint em{color:#67D998;font-style:normal}

/* achievements strip on overview */
.achgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:11px;margin-top:6px}
.ach{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:14px;text-align:center;opacity:.45;filter:grayscale(1);transition:all .3s}
.ach.unlocked{opacity:1;filter:none;border-color:var(--gold);box-shadow:0 2px 8px rgba(201,153,43,.18)}
.ach .ai{font-size:28px}
.ach .an{font-family:var(--disp);font-size:12.5px;font-weight:700;margin-top:5px;line-height:1.2}
.ach .ad{font-size:10.5px;color:var(--muted);margin-top:3px}

.hidden{display:none !important}
@media(max-width:1080px){.lower{grid-template-columns:1fr}.calcgrid{grid-template-columns:1fr}.billcard{position:static}}
@media(max-width:900px){
  .sidebar{display:none}
  .mobnav{display:block;padding:10px 0}
  .mobnav select{width:100%;padding:9px;border-radius:8px;border:1px solid var(--line-2);font-size:14px;font-family:inherit}
  .split{grid-template-columns:1fr}
  .mission .wrap{flex-wrap:wrap;gap:12px}
  .wrap{padding:0 18px}.hero h2{font-size:32px}
  .m .val{font-size:19px}
}
@media(prefers-reduced-motion:reduce){*{animation-duration:.01ms !important;transition-duration:.01ms !important}}

{
 n:1, g:1, title:"Excessive System Prompts", cat:"INPUT BLOAT",

 impact:"Cheaper on every call you will ever make",
 bad:{ metrics:[["System tokens",2400,"",2400],["Per 1M calls",2.4,"B",2.4],["Wasted",84,"%",100]],
   bars:[["Role definition",240],["Restated rules",620],["Verbose examples",980],["Formatting rules",380],["Actual task",180]],
   caption:"2,400 tokens · every request · forever",

 good:{ metrics:[["System tokens",380,"",380],["Per 1M calls",0.38,"B",0.38],["Wasted",6,"%",6]],
   bars:[["Role definition",80],["Rules (deduped)",120],["1 tight example",120],["Actual task",60]],
   caption:"380 tokens · same behaviour on evals",
   log:[["y","Deduplicating overlapping instructions…"],["g","Removed 4 restated rules · −620 tokens"],["g","Cut 3 of 4 examples · −860 tokens"],["g","2,400 → 380 tokens · eval score unchanged (94%)"]]},
 code:`<span class="c"># BEFORE — 2,400 tokens on every call</span>
SYSTEM = <span class="s">"""You are a helpful assistant. You should always be
helpful. When answering, be helpful and accurate...
[47 more lines restating the same three ideas]"""</span>

<span class="c"># AFTER — 380 tokens, same eval score</span>
SYSTEM = <span class="s">"""Support agent for Acme Cloud.
Answer from CONTEXT only. If absent, say you don't know.
Format: 2-3 sentences, then bullet steps if procedural."""</span>

<span class="c"># Measure it, don't guess it</span>
<span class="k">import</span> tiktoken
enc = tiktoken.<span class="f">get_encoding</span>(<span class="s">"cl100k_base"</span>)
<span class="f">print</span>(<span class="f">len</span>(enc.<span class="f">encode</span>(SYSTEM)))  <span class="c"># 380</span>

<span class="c"># Then gate it in CI so it can never creep back up</span>
<span class="k">assert</span> <span class="f">len</span>(enc.<span class="f">encode</span>(SYSTEM)) &lt; <span class="n">500</span>, <span class="s">"system prompt regression"</span>`

{
 n:2, g:1, title:"Long Chat History", cat:"INPUT BLOAT",
 lede:"Turn 40 of a conversation replays turns 1 through 39. Cost grows quadratically while value grows linearly.",
 hint:"Rolling summary plus last 6 turns. Context stays flat as the conversation grows.",
 sim:"stack", save:"20–40%", tech:["Sliding Window","Summarization","Memory buffer"],

 impact:"Flat cost per turn no matter how long the chat runs",

   stack:[["turn 1",900],["turn 10",9800],["turn 20",20400],["turn 30",31000],["turn 40",41800]],
   caption:"context tokens by turn · unbounded growth",
   log:[["d","Turn 40 · replaying full history"],["r","39 previous turns re-sent verbatim"],["r","41,800 input tokens for a 12-word question"],["r","Turn 80 would cost 4× this turn"]]},
 good:{ metrics:[["Turn",40,"",100],["Context tokens",4200,"",10],["Cost this turn",0.013,"$",10]],
   stack:[["turn 1",900],["turn 10",4100],["turn 20",4200],["turn 30",4200],["turn 40",4200]],
   caption:"summary + last 6 turns · flat forever",
   log:[["y","Turns 1–34 → rolling summary (620 tokens)"],["g","Keeping verbatim: last 6 turns (3,580 tokens)"],["g","Context 41,800 → 4,200 tokens"],["g","Turn 80 will still cost 4,200 tokens"]]},
 code:`<span class="k">from</span> langchain.memory <span class="k">import</span> ConversationSummaryBufferMemory

memory = <span class="f">ConversationSummaryBufferMemory</span>(
    llm=cheap_llm,             <span class="c"># summarize with the SMALL model</span>
    max_token_limit=<span class="n">4000</span>,     <span class="c"># hard ceiling on context</span>
    return_messages=<span class="k">True</span>,
)

<span class="c"># Manual version — same idea, no framework</span>
<span class="k">def</span> <span class="f">build_context</span>(history, keep=<span class="n">6</span>):
    recent = history[-keep:]
    older  = history[:-keep]
    <span class="k">if</span> <span class="f">count_tokens</span>(older) &gt; <span class="n">800</span>:
        summary = cheap_llm.<span class="f">invoke</span>(
            <span class="s">f"Summarize in &lt;150 words, keep decisions and IDs:\\n{older}"</span>
        )
        <span class="k">return</span> [{<span class="s">"role"</span>:<span class="s">"system"</span>,<span class="s">"content"</span>:<span class="s">f"Earlier: {summary}"</span>}] + recent
    <span class="k">return</span> history`
},
{
 n:3, g:1, title:"Unfiltered RAG Context", cat:"INPUT BLOAT",
 lede:"Vector search returns whatever is nearest. Nearest is not the same as correct, and you pay for every wrong chunk.",
 hint:"Metadata filter first, then search. Same recall, one fifth of the tokens.",
 sim:"grid", save:"40–70%", tech:["Metadata Filter","Hybrid Search","Namespace routing"],
 build:["Tag every chunk at ingest: tenant, doc type, date","Pre-filter before vector search","Hybrid BM25 + dense for exact terms","Reject below a similarity floor"],
 impact:"Right documents, a fraction of the context",
 bad:{ metrics:[["Chunks in prompt",32,"",100],["Relevant",5,"",16],["Precision",16,"%",16]],
   grid:{total:32,good:[3,9,14,21,27]},
   caption:"32 chunks retrieved · green = actually relevant",
   log:[["d","Query: 'Q3 refund policy for enterprise tier'"],["r","Vector search over 1 collection, no filters"],["r","Returned 2019 docs, sales decks, HR policy"],["r","32 chunks · 24,000 tokens · 5 were useful"]]},
 good:{ metrics:[["Chunks in prompt",6,"",19],["Relevant",5,"",83],["Precision",83,"%",83]],
   grid:{total:6,good:[0,1,2,3,4]},
   caption:"filtered to 6 · pre-filter did the work",
   log:[["y","Pre-filter: doc_type=policy, tier=enterprise, year>=2024"],["g","Search space 84,000 → 1,900 chunks"],["g","Hybrid BM25 + dense on filtered set"],["g","6 chunks · 4,400 tokens · precision 83%"]]},
 code:`<span class="c"># Tag at INGEST — you cannot filter what you did not label</span>
vectorstore.<span class="f">add_documents</span>(docs, metadatas=[{
    <span class="s">"tenant_id"</span>: <span class="s">"acme"</span>,
    <span class="s">"doc_type"</span>: <span class="s">"policy"</span>,
    <span class="s">"tier"</span>:     <span class="s">"enterprise"</span>,
    <span class="s">"year"</span>:     <span class="n">2025</span>,

<span class="c"># Filter BEFORE the vector math, not after</span>
results = vectorstore.<span class="f">similarity_search</span>(

    filter={<span class="s">"tenant_id"</span>:<span class="s">"acme"</span>, <span class="s">"doc_type"</span>:<span class="s">"policy"</span>, <span class="s">"year"</span>:{<span class="s">"$gte"</span>:<span class="n">2024</span>}},

<span class="c"># And enforce a relevance floor — no floor means noise always wins</span>
hits = [d <span class="k">for</span> d, score <span class="k">in</span>
        vectorstore.<span class="f">similarity_search_with_score</span>(query, k=<span class="n">20</span>)
        <span class="k">if</span> score &gt; <span class="n">0.78</span>][:<span class="n">6</span>]`
},

 n:4, g:1, title:"Too Many Retrieved Documents", cat:"INPUT BLOAT",
 lede:"k=20 feels safe. It is not safe — it is expensive, and it buries the answer in the middle where models read worst.",
 hint:"Retrieve 20 for recall, re-rank, send 4. Accuracy goes up, cost goes down.",
 sim:"grid", save:"30–60%", tech:["Top-K tuning","Cross-Encoder Rerank","Relevance floor"],
 build:["Retrieve wide (k=20) for recall","Cross-encoder re-rank the candidates","Send only the top 3–5","Log which k actually gets cited"],
 impact:"Higher accuracy and lower cost from the same index",
 bad:{ metrics:[["Sent to model",20,"",100],["Precision",20,"%",20],["Answer accuracy",61,"%",61]],
   grid:{total:20,good:[2,7,13,18]},
   caption:"all 20 stuffed in · answer buried at position 13",
   log:[["d","k=20 retrieved by cosine similarity"],["r","All 20 pasted into the prompt · 15,000 tokens"],["r","Signal at rank 13 — lost in the middle"],["r","Model answered from rank 2 (wrong doc)"]]},
 good:{ metrics:[["Sent to model",4,"",20],["Precision",100,"%",100],["Answer accuracy",93,"%",93]],
   grid:{total:4,good:[0,1,2,3]},
   caption:"re-ranked · top 4 kept · 16 dropped",
   log:[["y","Retrieved 20 · running cross-encoder rerank"],["g","Rank 13 promoted to rank 1 (score 0.94)"],["g","Dropped 16 below the 0.85 floor"],["g","4 chunks · 3,100 tokens · accuracy 61% → 93%"]]},
 code:`<span class="k">from</span> sentence_transformers <span class="k">import</span> CrossEncoder

reranker = <span class="f">CrossEncoder</span>(<span class="s">"BAAI/bge-reranker-base"</span>)

<span class="c"># 1. Retrieve WIDE — cheap, recall matters here</span>

<span class="c"># 2. Re-rank — a cross-encoder reads query+doc TOGETHER</span>

ranked = <span class="f">sorted</span>(<span class="f">zip</span>(candidates, scores), key=<span class="k">lambda</span> x: -x[<span class="n">1</span>])
final  = [d <span class="k">for</span> d, s <span class="k">in</span> ranked <span class="k">if</span> s &gt; <span class="n">0.85</span>][:<span class="n">4</span>]

<span class="c"># The reranker costs ~15ms and saves ~11,000 tokens per call.</span>
<span class="c"># That trade is not close.</span>`

   caption:"800 tokens retrieved · 340 used",

/* ---------- SOUND (WebAudio, subtle, optional) ---------- */
let AC=null, soundOn=true;
function beep(type){
  if(!soundOn) return;
  try{
    AC = AC || new (window.AudioContext||window.webkitAudioContext)();
    const t=AC.currentTime, o=AC.createOscillator(), g=AC.createGain();
    o.connect(g); g.connect(AC.destination);
    const cfg={
      tick:{f:660,d:.05,v:.05,tp:"sine"},
      cash:{f:880,d:.14,v:.08,tp:"triangle"},
      win:{f:520,d:.28,v:.09,tp:"sine"},
      err:{f:180,d:.14,v:.07,tp:"square"},
      unlock:{f:440,d:.08,v:.05,tp:"sine"}
    }[type]||{f:440,d:.06,v:.05,tp:"sine"};
    o.type=cfg.tp; o.frequency.setValueAtTime(cfg.f,t);
    if(type==="cash"||type==="win") o.frequency.exponentialRampToValueAtTime(cfg.f*1.6,t+cfg.d);
    if(type==="err") o.frequency.exponentialRampToValueAtTime(cfg.f*.6,t+cfg.d);
    g.gain.setValueAtTime(cfg.v,t); g.gain.exponentialRampToValueAtTime(.0001,t+cfg.d);
    o.start(t); o.stop(t+cfg.d);
  }catch(e){}
}

/* ---------- animated number counter ---------- */
function animateNumber(el, from, to, dur, formatter){
  const start=performance.now();
  function frame(now){
    const p=clamp((now-start)/dur,0,1);
    const eased=1-Math.pow(1-p,3);
    el.textContent=formatter(from+(to-from)*eased);
    if(p<1) requestAnimationFrame(frame);
  }
  requestAnimationFrame(frame);
}

/* ---------- current bill from solved set ---------- */
function currentBill(){
  let fIn=1,fOut=1,fReq=1,fPrice=1;
  S.solved.forEach(n=>{
    const f=FIX.find(x=>x.n===n); if(!f) return;
    if(f.t==="in")fIn*=(1-f.s); if(f.t==="out")fOut*=(1-f.s);
    if(f.t==="both")fReq*=(1-f.s); if(f.t==="price")fPrice*=(1-f.s);
  });
  // map the abstract fix multipliers onto the mission bill (60% input, 25% output weighted)
  const inShare=.6, outShare=.25, bothShare=.1, priceShare=.05;
  const factor = inShare*fIn*fReq + outShare*fOut*fReq + bothShare*fReq + priceShare*fPrice;
  const raw = BILL_START*factor;
  // normalize so all-20 lands near target
  return raw;
}

/* per-lesson standalone monthly cost, for the prediction stakes line.
   Derived from each fix's savings magnitude so bigger fixes read as bigger
   line items — deterministic, no randomness. */
function lineItemCost(n){
  const f=FIX.find(x=>x.n===n);
  const base=2400, span=17000;               // $2.4k – ~$19k range
  const mag=f?f.s:0.2;
  return Math.round((base+span*mag)/100)*100; // round to nearest $100
}

/* ---------- confetti ---------- */
const confCanvas=$("#confetti"), cctx=confCanvas&&confCanvas.getContext&&confCanvas.getContext("2d");
let confParts=[], confRAF=null;
function sizeConf(){ confCanvas.width=innerWidth; confCanvas.height=innerHeight; }
sizeConf(); addEventListener("resize",sizeConf);
function confetti(n){
  if(!cctx) return;
  const colors=["#1E7A4C","#48C07E","#2F3BB3","#C9992B","#FF8B7E","#7C3AED"];
  for(let i=0;i<n;i++){
    confParts.push({x:innerWidth/2+(Math.random()-.5)*200, y:innerHeight/2,
      vx:(Math.random()-.5)*11, vy:-Math.random()*13-4, g:.35,
      c:colors[i%colors.length], s:5+Math.random()*6, r:Math.random()*6, vr:(Math.random()-.5)*.4, life:1});
  }
  if(!confRAF) confLoop();
}
function confLoop(){
  cctx.clearRect(0,0,confCanvas.width,confCanvas.height);
  confParts.forEach(p=>{
    p.vy+=p.g; p.x+=p.vx; p.y+=p.vy; p.r+=p.vr; p.life-=.008;
    cctx.save(); cctx.translate(p.x,p.y); cctx.rotate(p.r); cctx.globalAlpha=Math.max(0,p.life);
    cctx.fillStyle=p.c; cctx.fillRect(-p.s/2,-p.s/2,p.s,p.s*.6); cctx.restore();
  });
  confParts=confParts.filter(p=>p.life>0 && p.y<confCanvas.height+40);
  if(confParts.length){ confRAF=requestAnimationFrame(confLoop); } else { confRAF=null; cctx.clearRect(0,0,confCanvas.width,confCanvas.height); }
}

/* ---------- ambient background ---------- */
const amb=$("#ambient"), actx=amb&&amb.getContext&&amb.getContext("2d");
let dots=[];
function sizeAmb(){ amb.width=innerWidth; amb.height=innerHeight;
  dots=Array.from({length:Math.min(46,Math.floor(innerWidth/32))},()=>({
    x:Math.random()*innerWidth, y:Math.random()*innerHeight,
    vx:(Math.random()-.5)*.18, vy:(Math.random()-.5)*.18, r:1+Math.random()*1.6})); }
sizeAmb(); addEventListener("resize",sizeAmb);
function ambLoop(){
  actx.clearRect(0,0,amb.width,amb.height);
  dots.forEach(d=>{ d.x+=d.vx; d.y+=d.vy;
    if(d.x<0||d.x>amb.width)d.vx*=-1; if(d.y<0||d.y>amb.height)d.vy*=-1;
    actx.fillStyle="rgba(47,59,179,0.10)"; actx.beginPath(); actx.arc(d.x,d.y,d.r,0,7); actx.fill(); });
  for(let i=0;i<dots.length;i++)for(let j=i+1;j<dots.length;j++){
    const a=dots[i],b=dots[j],dx=a.x-b.x,dy=a.y-b.y,dist=Math.hypot(dx,dy);
    if(dist<120){ actx.strokeStyle=`rgba(47,59,179,${.06*(1-dist/120)})`; actx.beginPath(); actx.moveTo(a.x,a.y); actx.lineTo(b.x,b.y); actx.stroke(); }
  }
  requestAnimationFrame(ambLoop);
}
const reduceMotion = (typeof matchMedia==="function") && matchMedia("(prefers-reduced-motion:reduce)").matches;
if(actx && !reduceMotion) ambLoop();

  }

      const rel=good.includes(i), bg=live?(rel?"#1E7A4C":(side==="bad"?"#F3B8AE":"#EDEBE4")):"#F0EEE8";

      const hot=/BILLED|LLM CALL|FRONTIER|SEND ALL|EMBED AS-IS|k=18|ANSWER WEAK/.test(tag);
      const col=side==="bad"?(hot?"var(--bad)":"var(--muted)"):(hot?"var(--warn)":"var(--good)");
      const bg=side==="bad"?(hot?"#FDF1EF":"#F7F6F2"):(hot?"#FDF6E9":"#EFF7F1");
      return `<div data-flow style="display:flex;align-items:center;gap:9px;background:${bg};border:1px solid ${side==="bad"?"#EFD6D2":"#CFE5D8"};border-radius:7px;padding:8px 11px;opacity:${live?1:.25};transition:opacity .3s ${i*110}ms">

    }).join("")+`</div>`;
  }
  if(b.sim==="gauge"){
    const {cap,used,label}=d.gauge, pct=Math.min(100,used/cap*100);
    return `<div><div style="height:34px;background:#F0EEE8;border-radius:7px;overflow:hidden;position:relative;border:1px solid ${side==="bad"?"#EFD6D2":"#CFE5D8"}">

  return "";
}
function metricsHTML(b, side, live){
  return b[side].metrics.map(([lab,val,unit,pct])=>{
    const shown=typeof val==="number"&&val%1!==0?val:Math.round(val);
    const pre=unit==="$"?"$":"", post=unit&&unit!=="$"?unit:"";
    return `<div class="m"><div class="lab">${esc(lab)}</div>
      <div class="val" data-mval="${val}" data-pre="${pre}" data-post="${post}">${pre}${live?(typeof shown==="number"?shown.toLocaleString():shown):"0"}<small>${post}</small></div>
      <div class="bar"><i style="width:${live?pct:0}%"></i></div></div>`;
  }).join("");
}
function termHTML(b, side, live){
  if(!live) return `<div class="tl"><span class="ln">01</span><span class="tx" style="color:#4A5361">$ waiting — press Run<span class="cursor"></span></span></div>`;
  return b[side].log.map(([kind,txt],i)=>`<div class="tl ${kind}" style="animation-delay:${i*260}ms"><span class="ln">${String(i+1).padStart(2,"0")}</span><span class="tx">${esc(txt)}</span></div>`).join("");
}

/* flip an already-painted lesson from zero to final by mutating nodes */
function paintLive(b){
  ["bad","good"].forEach(side=>{
    const pane=$(".side."+side+" .pane"); if(!pane) return;
    const d=b[side];
    [...pane.querySelectorAll(".mrow .bar i")].forEach((el,i)=>{ if(d.metrics[i]) el.style.width=d.metrics[i][3]+"%"; });
    // animate metric numbers counting up
    [...pane.querySelectorAll(".mrow .val")].forEach((el,i)=>{
      const m=d.metrics[i]; if(!m) return;
      const to=+m[1], pre=el.dataset.pre||"", post=el.dataset.post||"";
      animateNumber(el, 0, to, 700, v=>{
        const disp = to%1!==0 ? (Math.round(v*100)/100) : Math.round(v);
        return pre+disp.toLocaleString()+`<small>${post}</small>`;
      });
      // animateNumber sets textContent; re-inject small tag via innerHTML each frame is costly,
      // so instead set innerHTML directly:
      el.innerHTML = pre+"0"+`<small>${post}</small>`;
      countUp(el, to, pre, post);
    });
    const viz=pane.querySelector(".viz");
    if(viz){
      if(b.sim==="bars"){ const max=Math.max(...d.bars.map(x=>x[1])); [...viz.querySelectorAll("[data-bar]")].forEach((el,i)=>{ if(d.bars[i]) el.style.width=(d.bars[i][1]/max*100)+"%"; }); }
      if(b.sim==="stack"){ const max=Math.max(...d.stack.map(x=>x[1])); [...viz.querySelectorAll("[data-stack]")].forEach((el,i)=>{ if(d.stack[i]) el.style.height=(d.stack[i][1]/max*88)+"%"; }); }
      if(b.sim==="grid"){ [...viz.querySelectorAll("[data-cell]")].forEach((el,i)=>{ const rel=d.grid.good.includes(i); el.style.background=rel?"#1E7A4C":(side==="bad"?"#F3B8AE":"#EDEBE4"); }); }
      if(b.sim==="flow"){ [...viz.querySelectorAll("[data-flow]")].forEach(el=>el.style.opacity=1); }
      if(b.sim==="gauge"){ const {cap,used}=d.gauge,pct=Math.min(100,used/cap*100); const f=viz.querySelector("[data-gaugefill]"); if(f)f.style.width=pct+"%"; [...viz.querySelectorAll("[data-tick]")].forEach((el,i)=>{ if((i/24*100)<pct) el.style.background=side==="bad"?"var(--bad)":"var(--good)"; }); }
      if(b.sim==="timeline"){ [...viz.querySelectorAll("[data-tl]")].forEach(el=>el.style.opacity=1); }
    }
    const term=pane.querySelector(".term");
    if(term){ term.innerHTML="";
      d.log.forEach(([kind,txt],i)=>setTimeout(()=>{ if(!term.isConnected)return;
        const row=document.createElement("div"); row.className="tl "+kind;
        row.innerHTML=`<span class="ln">${String(i+1).padStart(2,"0")}</span><span class="tx">${esc(txt)}</span>`;
        term.appendChild(row); if(i<3) beep("tick");
      }, i*260));
    }
  });
}
function countUp(el,to,pre,post){
  const start=performance.now(), dur=700;
  function f(now){ const p=clamp((now-start)/dur,0,1), e=1-Math.pow(1-p,3), v=to*e;
    const disp= to%1!==0 ? (Math.round(v*100)/100) : Math.round(v);
    el.innerHTML=pre+disp.toLocaleString()+`<small>${post}</small>`;
    if(p<1) requestAnimationFrame(f);
  } requestAnimationFrame(f);
}

function reveal(id, withSound){
  const el=$("#"+id); if(!el||el.classList.contains("show")) return;
  el.classList.add("show");
  if(withSound){ beep("unlock"); }

function renderSteps(){

function wireLesson(b,gm){

  // PRO TIP

  };

  // COPY
  const cp=$("#cp"); if(cp) cp.onclick=()=>navigator.clipboard.writeText($("#codebody").innerText).then(()=>{ cp.textContent="Copied"; beep("tick"); setTimeout(()=>cp.textContent="Copy",1500); });

      else { opt.classList.add("wrong"); $$("#quizopts .qopt")[correct].classList.add("correct"); $("#quizfb").innerHTML=`<span style="color:var(--bad)">Not quite. ${esc(gm.quiz.fb)}</span>`; beep("err"); }

function runSim(b,gm,isReplay){
  const runBtn=$("#run");
  S.ran.delete(b.n);
  // repaint run stage at zero
  $("#viz-bad").innerHTML=vizHTML(b,"bad",false);
  $("#viz-good").innerHTML=vizHTML(b,"good",false);
  $(".side.bad .mrow").innerHTML=metricsHTML(b,"bad",false);
  $(".side.good .mrow").innerHTML=metricsHTML(b,"good",false);
  $(".side.bad .term").innerHTML=termHTML(b,"bad",false);
  $(".side.good .term").innerHTML=termHTML(b,"good",false);
  runBtn.disabled=true; runBtn.textContent="running…";
  requestAnimationFrame(()=>requestAnimationFrame(()=>{
    S.ran.add(b.n);
    paintLive(b);
    setStep(b.n,1); renderSteps();
    setTimeout(()=>{
      runBtn.textContent="✓ Simulation complete";
      $("#replay").style.display="inline-flex";
      reveal("stage-explain", true);
      // solving the lesson (first run only)
      if(!S.solved.has(b.n)) solveLesson(b,gm);
      setStep(b.n,3); renderSteps();
      setTimeout(()=>reveal("stage-cliff", true), 500);
    }, 1500);
  }));
}

    <div class="hero">
      <div class="kick">Enterprise token &amp; cost economics · the game</div>
      <h2>Can you beat the $120,000 bill?</h2>
      <p>Twenty engineering mistakes are inflating this LLM bill. Solve each challenge to drive the monthly cost down toward <span class="strike">$30,000</span> — run the simulation, learn the fix, earn XP.</p>
      <button class="startbtn" id="startbtn">▶ Start Challenge 01</button>
    </div>

    <div class="sec">
      <h3 class="sechead">Your achievements</h3>
      <p class="secsub">Unlock badges as you clear categories, dig into pro tips, and ace quizzes.</p>
      <div class="achgrid" id="achgrid"></div>
    </div>

    <div class="sec">
      <div style="display:flex;justify-content:space-between;align-items:baseline;flex-wrap:wrap;gap:8px">
        <h3 class="sechead">Sandbox calculator</h3>
        <label style="font-size:12.5px;color:var(--muted);display:flex;gap:7px;align-items:center"><input type="checkbox" id="soundtoggle" checked> sound effects</label>
      </div>
      <p class="secsub">Prefer to explore freely? Move the sliders and toggle any of the 20 fixes to see the math directly.</p>
      <div class="calcgrid">
        <div>
          <div class="ctrl"><label>Requests per day <b id="l-req">50,000</b></label><input type="range" id="s-req" min="100" max="500000" step="100" value="50000"></div>
          <div class="ctrl"><label>Input tokens / request <b id="l-in">6,000</b></label><input type="range" id="s-in" min="200" max="60000" step="100" value="6000"></div>
          <div class="ctrl"><label>Output tokens / request <b id="l-out">800</b></label><input type="range" id="s-out" min="50" max="8000" step="50" value="800"></div>
          <div class="ctrl"><label>Model <b id="l-model">Frontier tier</b></label><div class="selrow" id="modelsel"></div></div>
        </div>
        <div class="billcard">
          <div class="lab">Monthly bill — no optimization</div><div class="amt red" id="bill-before">$0</div><div class="sub" id="tok-before">—</div>
          <div class="billsplit"></div>
          <div class="lab">With selected fixes</div><div class="amt grn" id="bill-after">$0</div><div class="sub" id="tok-after">—</div>
          <div class="saveline"><span class="t">You keep</span><span class="v" id="saved">$0 / mo · 0%</span></div>
          <div class="saveline"><span class="t">Per year</span><span class="v" id="savedyr">$0</span></div>
          <div class="togglegrid" id="toggles"></div>
          <button class="copybtn" style="margin-top:12px;width:100%;padding:7px;color:#C9D1D9;background:#1A1F27;border-color:#2A303A" id="toggleall">Turn all fixes on</button>
        </div>
      </div>
    </div>

    <div class="sec" style="border-bottom:0">
      <h3 class="sechead">Twenty challenges, five root causes</h3>
      <p class="secsub">Every mistake is one of five failure modes. Click any number to jump into that challenge.</p>
      <div class="rcgrid" id="rootcauses"></div>
    </div>`;
  renderAchStrip();
  $("#startbtn").onclick=()=>go(0);
  $("#soundtoggle").onchange=e=>{ soundOn=e.target.checked; };
  buildCalc(); buildRoots();
}

function renderAchStrip(){
  const el=$("#achgrid"); if(!el) return;
  el.innerHTML=ACHIEVEMENTS.map(a=>`<div class="ach ${S.achieved.has(a.id)?"unlocked":""}">
    <div class="ai">${a.icon}</div><div class="an">${esc(a.name)}</div><div class="ad">${esc(a.desc)}</div></div>`).join("");
}

/* calculator */
let model="large";
function calc(){
  const req=+$("#s-req").value,tin=+$("#s-in").value,tout=+$("#s-out").value;
  $("#l-req").textContent=req.toLocaleString(); $("#l-in").textContent=tin.toLocaleString(); $("#l-out").textContent=tout.toLocaleString();
  const m=MODELS.find(x=>x.k===model); $("#l-model").textContent=m.n;
  const mo=30, inTot=req*tin*mo, outTot=req*tout*mo, before=inTot/1e6*m.in+outTot/1e6*m.out;
  let fIn=1,fOut=1,fReq=1,fPrice=1;
  calcActive.forEach(n=>{ const f=FIX.find(x=>x.n===n); if(f.t==="in")fIn*=(1-f.s); if(f.t==="out")fOut*=(1-f.s); if(f.t==="both")fReq*=(1-f.s); if(f.t==="price")fPrice*=(1-f.s); });
  const inA=inTot*fIn*fReq, outA=outTot*fOut*fReq, after=(inA/1e6*m.in+outA/1e6*m.out)*fPrice;
  $("#bill-before").textContent=usd(before); $("#bill-after").textContent=usd(after);
  $("#tok-before").textContent=fmt(inTot+outTot)+" tokens / month"; $("#tok-after").textContent=fmt(inA+outA)+" tokens / month";
  const saved=before-after,pct=before>0?saved/before*100:0;
  $("#saved").textContent=usd(saved)+" / mo · "+pct.toFixed(0)+"%"; $("#savedyr").textContent=usd(saved*12);
}
const calcActive=new Set();
function buildCalc(){
  $("#modelsel").innerHTML=MODELS.map(m=>`<button data-k="${m.k}" class="${m.k===model?"on":""}">${m.n}</button>`).join("");
  $$("#modelsel button").forEach(el=>el.onclick=()=>{ model=el.dataset.k; $$("#modelsel button").forEach(x=>x.classList.toggle("on",x.dataset.k===model)); calc(); });
  $("#toggles").innerHTML=B.map(b=>`<div class="tg" data-n="${b.n}"><span class="box">✓</span><span class="nm">${String(b.n).padStart(2,"0")} ${esc(b.title)}</span><span class="pc">${esc(b.save)}</span></div>`).join("");
  $$(".tg").forEach(el=>el.onclick=()=>{ const n=+el.dataset.n; calcActive.has(n)?calcActive.delete(n):calcActive.add(n); el.classList.toggle("on",calcActive.has(n)); calc(); });
  $("#toggleall").onclick=()=>{ const all=calcActive.size===B.length; calcActive.clear(); if(!all)B.forEach(b=>calcActive.add(b.n)); $$(".tg").forEach(el=>el.classList.toggle("on",calcActive.has(+el.dataset.n))); $("#toggleall").textContent=all?"Turn all fixes on":"Turn all fixes off"; calc(); };
  ["s-req","s-in","s-out"].forEach(id=>$("#"+id).oninput=calc); calc();
}
function buildRoots(){
  $("#rootcauses").innerHTML=ROOT.map((r,i)=>`<div class="rc"><div class="num">ROOT CAUSE ${i+1}</div><h5>${esc(r.t)}</h5><p>${esc(r.d)}</p><div class="ids">${r.ids.map(n=>`<span class="id" data-n="${n}">${String(n).padStart(2,"0")}</span>`).join("")}</div></div>`).join("");
  $$("#rootcauses .id").forEach(el=>el.onclick=()=>go(+el.dataset.n-1));
}

/* reference view */
function buildAll(){
  $("#v-all").innerHTML=`
    <div class="sec">
      <h3 class="sechead">The reference table</h3>
      <p class="secsub">Every challenge, its fix, and the realistic savings band. Click a row to open it.</p>
      <div class="tblwrap" style="border:1px solid var(--line);border-radius:var(--r);overflow:hidden;background:#fff">
        <table class="t20" style="width:100%;border-collapse:collapse;font-size:13.4px"><thead><tr>
          <th style="background:#F2F0EA;text-align:left;padding:10px 13px;font-family:var(--mono);font-size:10px;letter-spacing:.11em;text-transform:uppercase;color:var(--muted);border-bottom:1px solid var(--line)">#</th>
          <th style="background:#F2F0EA;text-align:left;padding:10px 13px;font-family:var(--mono);font-size:10px;letter-spacing:.11em;text-transform:uppercase;color:var(--muted);border-bottom:1px solid var(--line)">Challenge</th>
          <th style="background:#F2F0EA;text-align:left;padding:10px 13px;font-family:var(--mono);font-size:10px;letter-spacing:.11em;text-transform:uppercase;color:var(--muted);border-bottom:1px solid var(--line)">The fix</th>
          <th style="background:#F2F0EA;text-align:left;padding:10px 13px;font-family:var(--mono);font-size:10px;letter-spacing:.11em;text-transform:uppercase;color:var(--muted);border-bottom:1px solid var(--line)">Savings</th>
        </tr></thead><tbody id="t20body"></tbody></table>
      </div>
    </div>
    <div class="sec">
      <h3 class="sechead">The optimization pipeline</h3>
      <p class="secsub">The architecture all twenty fixes live inside. Click a stage to see which challenges it removes.</p>
      <div class="pipe" id="pipe"></div><div class="pdetail" id="pdetail"></div>
    </div>
    <div class="sec" style="border-bottom:0">
      <h3 class="sechead">What to build first</h3>
      <p class="secsub">Ordered by effort-to-impact, not list position. Week one alone typically cuts 40–55%.</p>
      <div class="rmgrid" id="roadmap"></div>
      <div class="thepoint"><div class="lab">The point</div>
        <p>Not one of these twenty is solved by switching to a cheaper model. Every one is an architecture problem — <em>what you send, how often you send it, and who you send it to.</em></p></div>
    </div>`;
  $("#t20body").innerHTML=B.map((b,i)=>`<tr data-i="${i}" style="cursor:pointer">
    <td style="padding:10px 13px;border-bottom:1px solid #EFEDE7;font-family:var(--mono);color:var(--muted-2);font-size:12px">${String(b.n).padStart(2,"0")}</td>
    <td style="padding:10px 13px;border-bottom:1px solid #EFEDE7;font-weight:600">${esc(b.title)} ${S.solved.has(b.n)?'<span style="color:var(--good)">✓</span>':''}</td>
    <td style="padding:10px 13px;border-bottom:1px solid #EFEDE7;color:var(--good)">${esc(b.build[0])}</td>
    <td style="padding:10px 13px;border-bottom:1px solid #EFEDE7;font-family:var(--mono);color:var(--good);font-weight:600;white-space:nowrap">${esc(b.save)}</td></tr>`).join("");
  $$("#t20body tr").forEach(el=>{ el.onclick=()=>go(+el.dataset.i); el.onmouseenter=()=>el.style.background="#FAF9F5"; el.onmouseleave=()=>el.style.background=""; });

  $("#pipe").innerHTML=PIPE.map((p,i)=>`<button class="pstage ${i===0?"on":""}" data-i="${i}"><div class="pn">STAGE ${String(i+1).padStart(2,"0")}</div><div class="pt">${esc(p.t)}</div><div class="pd">${esc(p.d)}</div></button>`).join("");
  $$(".pstage").forEach(el=>el.onclick=()=>{ $$(".pstage").forEach(x=>x.classList.remove("on")); el.classList.add("on"); showStage(+el.dataset.i); });
  showStage(0);

  $("#roadmap").innerHTML=ROADMAP.map(r=>`<div class="rm ${r.cls}"><span class="wk">${esc(r.w)}</span><h5>${esc(r.t)}</h5><ul>${r.items.map(x=>`<li>${esc(x)}</li>`).join("")}</ul><div class="eff">${esc(r.eff)}</div></div>`).join("");
}
function showStage(i){
  const p=PIPE[i];
  $("#pdetail").innerHTML=`<h5>${esc(p.t)}</h5><p>${esc(p.body)}</p>
    <div style="font-family:var(--mono);font-size:10.5px;letter-spacing:.11em;text-transform:uppercase;color:var(--muted);margin-bottom:8px;font-weight:600">Challenges this stage removes</div>
    <div style="display:flex;flex-wrap:wrap;gap:6px">${p.ids.map(n=>`<span class="id" data-n="${n}" style="font-family:var(--mono);font-size:11.5px;background:#F2F0EA;border:1px solid var(--line);border-radius:6px;padding:4px 9px;cursor:pointer">${String(n).padStart(2,"0")} · ${esc(B[n-1].title)}</span>`).join("")}</div>`;
  $$("#pdetail .id").forEach(el=>el.onclick=()=>go(+el.dataset.n-1));
}

/* ============================================================
   INIT + keyboard
   ============================================================ */
$$(".mtab").forEach(t=>t.onclick=()=>{ setView(t.dataset.view); window.scrollTo({top:0,behavior:"instant"}); });
$("#prev").onclick=()=>go(cur-1);
$("#next").onclick=()=>go(cur+1);
document.addEventListener("keydown",e=>{
  if(/input|select|textarea/i.test(e.target.tagName)) return;
  if(view==="lesson"){
    if(e.key==="ArrowLeft") go(cur-1);
    if(e.key==="ArrowRight") go(cur+1);
    if(e.key===" "){ e.preventDefault(); const r=$("#run"); if(r&&!r.disabled) r.click(); }
    if(e.key==="r"||e.key==="R"){ const rp=$("#replay"); if(rp&&rp.style.display!=="none") rp.click(); }
    if(e.key==="h"||e.key==="H"){ const tb=$("#tipbtn"); if(tb) tb.click(); }
    if(e.key==="c"||e.key==="C"){ const cp=$("#cp"); if(cp) cp.click(); }
  }
});

buildNav();
buildOverview();
buildAll();
setView("overview");
refreshMission(false);
$("#pgnum").textContent="1 / 20";
$("#prev").disabled=true;

/* expose a small debug surface (used by tests; harmless in prod) */
window.__TCL={S,B,GAME,go,refreshMission,currentBill,get cur(){return cur;}};

</script>
</body>
</html>
